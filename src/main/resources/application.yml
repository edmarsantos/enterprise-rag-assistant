spring:

  config:
    import: classpath:secrets.properties

  application:
    name: enterprise-rag-assistant

  datasource:
    url: jdbc:postgresql://localhost:5432/ragdb
    username: ${DB_USERNAME:raguser}
    password: ${DB_PASSWORD:ragpassword}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true

  ai:

    model:
      chat: none
      embedding: ollama
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

    ollama:
      base-url: http://localhost:11434

      embedding:
        model: mxbai-embed-large

server:
  port: 8080

management:

  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics

  endpoint:
    health:
      show-details: always